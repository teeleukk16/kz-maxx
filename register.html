<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | kz-maxx</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page">
        <header class="top">
            <div class="top-left">
                <h1 class="logo">
                    <a href="website.html">kz<span>-</span>maxx</a>
                </h1>

                <div class="header-contacts">
                    <a href="https://codeforces.com/profile/Teeleu" target="_blank">📊 Codeforces</a>
                    <a href="https://t.me/+qaJOFXS6IlYyMjIy" target="_blank">✈️ Telegram</a>
                </div>
            </div>

            <div class="top-menu">
                <div class="langs">
                    <a class="lang active" href="register.html">RU</a>
                    <a class="lang" href="register_kz.html">KZ</a>
                </div>

                <a class="top-btn" href="website.html">Главная</a>
                <a class="top-btn" href="chat.html">Чат</a>
                <a class="top-btn" href="members.html">Участники</a>
                <a class="top-btn blue" href="login.html">Вход</a>
            </div>
        </header>

        <main class="auth-page">
            <section class="auth-card">
                <h1>Регистрация</h1>
                <p>Создай аккаунт для чата и участия на сайте</p>

                <label for="nicknameInput">Nickname</label>
                <input id="nicknameInput" class="auth-input" type="text" placeholder="Например: Teeleu" maxlength="30">

                <label for="emailInput">Email</label>
                <input id="emailInput" class="auth-input" type="email" placeholder="example@mail.com">

                <label for="passwordInput">Пароль</label>

                <div class="password-row">
                    <input id="passwordInput" class="auth-input" type="password" placeholder="Минимум 6 символов">
                    <button id="showPasswordBtn" type="button">👁</button>
                </div>

                <label for="passwordRepeatInput">Повтори пароль</label>

                <div class="password-row">
                    <input id="passwordRepeatInput" class="auth-input" type="password" placeholder="Повтори пароль">
                    <button id="showRepeatPasswordBtn" type="button">👁</button>
                </div>

                <button id="registerBtn" class="auth-main-btn">Зарегистрироваться</button>

                <p id="statusText" class="auth-status"></p>

                <div class="auth-bottom">
                    <span>Уже есть аккаунт?</span>
                    <a href="login.html">Войти</a>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://jelwhsfcjyqlaxomipam.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_cefK5xE4WT4fltCdlsfV_A_BwlEJKbZ";

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const nicknameInput = document.getElementById("nicknameInput");
        const emailInput = document.getElementById("emailInput");
        const passwordInput = document.getElementById("passwordInput");
        const passwordRepeatInput = document.getElementById("passwordRepeatInput");
        const registerBtn = document.getElementById("registerBtn");
        const statusText = document.getElementById("statusText");
        const showPasswordBtn = document.getElementById("showPasswordBtn");
        const showRepeatPasswordBtn = document.getElementById("showRepeatPasswordBtn");

        function setStatus(text, type) {
            statusText.textContent = text;
            statusText.className = "auth-status " + type;
        }

        function isValidNickname(name) {
            return /^[a-zA-Z0-9_а-яА-ЯёЁәіңғүұқөһӘІҢҒҮҰҚӨҺ-]{3,30}$/.test(name);
        }

        function togglePassword(input, btn) {
            if (input.type === "password") {
                input.type = "text";
                btn.textContent = "🙈";
            } else {
                input.type = "password";
                btn.textContent = "👁";
            }
        }

        async function checkNickname(nickname) {
            const result = await db
                .from("profiles")
                .select("id")
                .ilike("name", nickname)
                .maybeSingle();

            if (result.error) {
                console.log(result.error);
                return false;
            }

            return !!result.data;
        }

        async function register() {
            const nickname = nicknameInput.value.trim();
            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;
            const passwordRepeat = passwordRepeatInput.value;

            if (!nickname || !email || !password || !passwordRepeat) {
                setStatus("Заполни все поля", "error");
                return;
            }

            if (!isValidNickname(nickname)) {
                setStatus("Nickname должен быть 3-30 символов. Можно буквы, цифры, _ и -", "error");
                return;
            }

            if (password.length < 6) {
                setStatus("Пароль должен быть минимум 6 символов", "error");
                return;
            }

            if (password !== passwordRepeat) {
                setStatus("Пароли не совпадают", "error");
                return;
            }

            registerBtn.disabled = true;
            registerBtn.textContent = "Регистрируем...";

            setStatus("Проверяем nickname...", "info");

            const nicknameExists = await checkNickname(nickname);

            if (nicknameExists) {
                registerBtn.disabled = false;
                registerBtn.textContent = "Зарегистрироваться";

                setStatus("Этот nickname уже занят", "error");
                return;
            }

            setStatus("Создаем аккаунт...", "info");

            const result = await db.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: {
                        name: nickname
                    }
                }
            });

            registerBtn.disabled = false;
            registerBtn.textContent = "Зарегистрироваться";

            if (result.error) {
                console.log(result.error);

                if (result.error.message.includes("already registered")) {
                    setStatus("Этот email уже зарегистрирован", "error");
                } else {
                    setStatus("Ошибка регистрации. Проверь данные", "error");
                }

                return;
            }

            setStatus("Вам на почту отправлена ссылка для подтверждения", "success");

            nicknameInput.value = "";
            emailInput.value = "";
            passwordInput.value = "";
            passwordRepeatInput.value = "";

            registerBtn.disabled = false;
            registerBtn.textContent = "Зарегистрироваться";
        }

        registerBtn.addEventListener("click", register);

        nicknameInput.addEventListener("keydown", e => {
            if (e.key === "Enter") {
                emailInput.focus();
            }
        });

        emailInput.addEventListener("keydown", e => {
            if (e.key === "Enter") {
                passwordInput.focus();
            }
        });

        passwordInput.addEventListener("keydown", e => {
            if (e.key === "Enter") {
                passwordRepeatInput.focus();
            }
        });

        passwordRepeatInput.addEventListener("keydown", e => {
            if (e.key === "Enter") {
                register();
            }
        });

        showPasswordBtn.addEventListener("click", () => {
            togglePassword(passwordInput, showPasswordBtn);
        });

        showRepeatPasswordBtn.addEventListener("click", () => {
            togglePassword(passwordRepeatInput, showRepeatPasswordBtn);
        });
    </script>
    <footer class="footer">
    © 2026 kz-maxx. Created by Teeleu. All rights reserved.
</footer>
</body>
</html>
